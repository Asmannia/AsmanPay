<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>ADMIN PANEL</h1>
    <p>Game Topup</p>
</header>

<main>

<section id="loginSection">

    <h2>Admin Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <button id="loginButton">
        Login
    </button>

    <p id="loginMessage"></p>

</section>


<section id="adminSection" style="display:none;">

    <h2>Orders</h2>

    <button id="logoutButton">
        Logout
    </button>

    <div id="orderList">
        Loading orders...
    </div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// ==============================
// SUPABASE
// ==============================

const SUPABASE_URL = "https://xwbaglonlmyzqlfbqhfz.supabase.co";
const SUPABASE_KEY = "sb_publishable_4y7E5I_0Gzjc7tMS3FX2RA_2KYumqjo";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==============================
// ELEMENT
// ==============================

const loginSection =
    document.getElementById("loginSection");

const adminSection =
    document.getElementById("adminSection");

const loginButton =
    document.getElementById("loginButton");

const logoutButton =
    document.getElementById("logoutButton");

const loginMessage =
    document.getElementById("loginMessage");

const orderList =
    document.getElementById("orderList");


// ==============================
// LOGIN
// ==============================

loginButton.addEventListener("click", async function() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {

        loginMessage.textContent =
            "Sila masukkan email dan password.";

        return;
    }

    loginMessage.textContent =
        "Logging in...";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        loginMessage.textContent =
            "Login gagal: " + error.message;

        return;
    }


    const user =
        data.user;


    // ==============================
    // CHECK ADMIN ROLE
    // ==============================

    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("role")
            .eq("id", user.id)
            .single();


    if (profileError || !profile) {

        await supabaseClient.auth.signOut();

        loginMessage.textContent =
            "Profile admin tidak dijumpai.";

        return;
    }


    if (profile.role !== "admin") {

        await supabaseClient.auth.signOut();

        loginMessage.textContent =
            "Akaun ini bukan admin.";

        return;
    }


    // ==============================
    // SHOW ADMIN
    // ==============================

    loginSection.style.display =
        "none";

    adminSection.style.display =
        "block";


    loadOrders();

});


// ==============================
// LOAD ORDERS
// ==============================

async function loadOrders() {

    orderList.innerHTML =
        "<p>Loading orders...</p>";


    const { data, error } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order("id", {
                ascending: false
            });


    if (error) {

        orderList.innerHTML =
            "<p>Gagal load order: "
            + error.message
            + "</p>";

        return;
    }


    if (!data || data.length === 0) {

        orderList.innerHTML =
            "<p>Belum ada order.</p>";

        return;
    }


    orderList.innerHTML = "";


    data.forEach(function(order) {

        const card =
            document.createElement("div");

        card.className = "card";


        card.innerHTML = `

            <h3>Order #${order.id}</h3>

            <p>
                Player ID:
                ${order.player_id}
            </p>

            <p>
                Zone ID:
                ${order.zone_id || "-"}
            </p>

            <p>
                Harga:
                RM ${Number(order.total_price).toFixed(2)}
            </p>

            <p>
                Payment:
                ${order.payment_method || "-"}
            </p>

            <p>
                Payment Status:
                ${order.payment_status}
            </p>

            <p>
                Order Status:
                ${order.order_status}
            </p>

            <p>
                Tarikh:
                ${new Date(order.created_at).toLocaleString()}
            </p>

        `;


        orderList.appendChild(card);

    });

}


// ==============================
// LOGOUT
// ==============================

logoutButton.addEventListener("click", async function() {

    await supabaseClient.auth.signOut();

    adminSection.style.display =
        "none";

    loginSection.style.display =
        "block";

    document.getElementById("email").value =
        "";

    document.getElementById("password").value =
        "";

});

</script>

</body>
